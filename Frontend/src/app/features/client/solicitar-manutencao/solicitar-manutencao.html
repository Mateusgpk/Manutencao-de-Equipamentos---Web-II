<section class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-100 p-8">

        <h1 class="text-2xl font-bold text-center mb-4">Solicitar Manutenção</h1>

        <form id="form-solicitar-manutencao" class="flex flex-col gap-5">

            <div class="flex flex-col">
                <label for="descricaoEquipamento" class="text-sm font-medium mb-1">
                    Descrição do Equipamento
                </label>
                <input type="text" id="descricaoEquipamento" name="descricaoEquipamento" required>
            </div>

            <div class="flex flex-col">
                <label for="categoriaEquipamento" class="text-sm font-medium mb-1">
                    Categoria do Equipamento
                </label>
                <input type="text" id="categoriaEquipamento" name="categoriaEquipamento" required>
            </div>

            <div class="flex flex-col">
                <label for="descricaoDefeito" class="text-sm font-medium mb-1">
                    Descrição do Defeito
                </label>
                <textarea id="descricaoDefeito" name="descricaoDefeito" required></textarea>
            </div>

            <button type="submit" class="mt-2 w-full">
                Enviar Solicitação
            </button>

        </form>

    </div>

</section>
