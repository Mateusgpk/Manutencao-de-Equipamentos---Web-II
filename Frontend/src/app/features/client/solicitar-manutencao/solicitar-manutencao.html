<section class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Solicitar Manutenção</h1>

        <form [formGroup]="formSolicitacao" (ngSubmit)="enviarSolicitacao()" class="flex flex-col gap-5">

            <app-input-texto id="equipamento" label="Descrição do Equipamento"
                placeholder="Ex: PC Intel Pentium G4560 GTX1030"
                [control]="formSolicitacao.controls.descricaoEquipamento"></app-input-texto>

            <app-input-texto id="categoria" label="Categoria do Equipamento" placeholder="Ex: Computadores / Desktop"
                [control]="formSolicitacao.controls.categoriaEquipamento"></app-input-texto>

            <app-text-area id="descricaoProblema" label="Descrição do Problema"
                placeholder="Desliga quando tem alto processamento"
                [control]="formSolicitacao.controls.descricaoProblema"></app-text-area>

            <button type="submit" class="mt-2 w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                Enviar Solicitação
            </button>

        </form>
    </div>

</section>
