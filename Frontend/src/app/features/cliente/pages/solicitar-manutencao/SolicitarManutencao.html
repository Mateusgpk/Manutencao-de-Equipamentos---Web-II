<section class="mx-auto w-full max-w-xl px-4 py-10">
  <div class="rounded-xl border border-slate-200 bg-white/90 p-6 shadow-sm backdrop-blur-sm">
    <div class="mb-6 border-b border-slate-100 pb-4">
      <h1 class="text-xl font-bold text-slate-900">Solicitar Manutenção</h1>
      <p class="mt-1 text-sm text-slate-500">
        Preencha os dados do equipamento para abrir o chamado
      </p>
    </div>

    <form
      [formGroup]="formSolicitacao"
      (ngSubmit)="enviarSolicitacao()"
      class="flex flex-col gap-4"
    >
      <app-input-texto
        id="equipamento"
        label="Descrição do Equipamento"
        placeholder="Ex: PC Intel Pentium G4560 GTX1030"
        [control]="formSolicitacao.controls.descricaoEquipamento"
      >
      </app-input-texto>

      <app-select
        label="Categoria do Equipamento"
        [options]="opcoesCategoriaEquipamento()"
        [control]="formSolicitacao.controls.categoriaEquipamento"
      >
      </app-select>

      <app-text-area
        id="descricaoProblema"
        label="Descrição do Problema"
        placeholder="Desliga quando tem alto processamento"
        [control]="formSolicitacao.controls.descricaoProblema"
      >
      </app-text-area>

      @if (erro()) {
        <p class="text-sm text-red-600">{{ erro() }}</p>
      }

      <div class="mt-2 flex gap-3">
        <a routerLink="/home"
          class="w-1/2 cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2 text-center text-slate-700 transition hover:bg-slate-50">
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="enviando()"
          class="w-1/2 cursor-pointer rounded-lg bg-blue-600 px-4 py-2 font-medium text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Enviar Solicitação
        </button>
      </div>
    </form>
  </div>

  @if (solicitacaoAberta()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4 backdrop-blur-sm">
      <div class="w-full max-w-sm rounded-xl bg-white p-6 text-center shadow-lg">
        <p class="font-semibold text-slate-900">Solicitação aberta com sucesso!</p>
        <button
          type="button"
          class="mt-6 w-full cursor-pointer rounded-lg bg-blue-600 px-5 py-2 font-medium text-white shadow-sm transition hover:bg-blue-700"
          (click)="voltarParaInicio()"
        >
          OK
        </button>
      </div>
    </div>
  }
</section>
