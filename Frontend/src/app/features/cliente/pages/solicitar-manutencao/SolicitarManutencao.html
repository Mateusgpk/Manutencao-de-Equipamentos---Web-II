<section class="w-full flex items-center justify-center p-4">
  <div
    class="w-full max-w-lg bg-surface/70 backdrop-blur-md border border-border rounded-xl shadow-sm shadow-primary-subtle/50 p-8"
  >
    <div class="text-center mb-6 pb-4 border-b border-border">
      <h1
        class="text-2xl font-extrabold font-heading bg-linear-to-b from-primary to-primary-hover bg-clip-text text-transparent drop-shadow-xs"
      >
        Solicitar Manutenção
      </h1>
      <p class="text-xs text-foreground-muted mt-1">
        Preencha os dados do equipamento para abrir o chamado
      </p>
    </div>

    <form
      [formGroup]="formSolicitacao"
      (ngSubmit)="enviarSolicitacao()"
      class="flex flex-col gap-5"
    >
      <app-input-texto
        id="equipamento"
        label="Descrição do Equipamento"
        placeholder="Ex: PC Intel Pentium G4560 GTX1030"
        [control]="formSolicitacao.controls.descricaoEquipamento"
      >
      </app-input-texto>

      <app-select
        label="Categoria do Equipamento"
        [options]="opcoesCategoriaEquipamento()"
        [control]="formSolicitacao.controls.categoriaEquipamento"
      >
      </app-select>

      <app-text-area
        id="descricaoProblema"
        label="Descrição do Problema"
        placeholder="Desliga quando tem alto processamento"
        [control]="formSolicitacao.controls.descricaoProblema"
      >
      </app-text-area>
      @if (erro()) {
        <p class="text-sm text-danger">{{ erro() }}</p>
      }

      <button
        type="submit"
        [disabled]="enviando()"
        class="mt-3 w-full bg-linear-to-b from-primary-subtle to-primary text-on-primary font-heading font-bold text-base py-2.5 px-6 rounded-full border border-primary shadow-md shadow-primary/30 transition-all hover:brightness-110 hover:scale-[1.02] active:scale-95 cursor-pointer disabled:opacity-60"
      >
        Enviar Solicitação
      </button>
    </form>
  </div>

  @if (solicitacaoAberta()) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center bg-foreground/40 backdrop-blur-xs px-4"
    >
      <div
        class="w-full max-w-sm rounded-xl border border-border bg-surface p-6 text-center shadow-sm"
      >
        <p class="font-heading font-bold text-foreground">Solicitação aberta com sucesso!</p>
        <button
          type="button"
          class="mt-6 w-full bg-linear-to-b from-primary-subtle to-primary text-on-primary font-heading font-bold py-2 px-6 rounded-full border border-primary cursor-pointer"
          (click)="voltarParaInicio()"
        >
          OK
        </button>
      </div>
    </div>
  }
</section>
