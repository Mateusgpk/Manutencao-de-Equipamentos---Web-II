<section class="max-w-xl mx-auto w-full px-4 py-10">
  <div class="rounded-xl border border-slate-200 bg-white/90 p-6 shadow-sm backdrop-blur-sm">
    <h1 class="mb-6 text-xl font-bold text-slate-900">
      {{ novoUsuario() ? 'Cadastrar Funcionário' : 'Editar Funcionário' }}
    </h1>

    <form [formGroup]="FormCadastro" (ngSubmit)="addEditFuncionario()" class="flex flex-col gap-4">
      <app-input-texto id="nome" label="Nome" placeholder="Ex: Peter Parker"
        [control]="FormCadastro.controls.name"></app-input-texto>
      <app-input-texto class="forms-control" id="email" label="Email" placeholder="peter.parker@example.com"
        [control]="FormCadastro.controls.email"></app-input-texto>
      <app-input-texto class="forms-control" id="senha" label="Senha" type="password" placeholder="********"
        [control]="FormCadastro.controls.senha"></app-input-texto>
      <app-input-texto class="forms-control" id="dataNascimento" label="Data de Nascimento" type="date"
        [control]="FormCadastro.controls.dataNascimento"></app-input-texto>

      <div class="mt-4 flex gap-3">
        <a routerLink="/employee/crud-funcionario"
          class="w-1/2 cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2 text-center text-slate-700 transition hover:bg-slate-50">
          Cancelar
        </a>
        <button type="submit"
          class="w-1/2 cursor-pointer rounded-lg bg-blue-600 px-4 py-2 font-medium text-white shadow-sm transition hover:bg-blue-700">
          {{ novoUsuario() ? 'Cadastrar' : 'Salvar Alterações' }}
        </button>
      </div>
    </form>
  </div>
</section>
