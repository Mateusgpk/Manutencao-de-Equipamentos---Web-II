<div class="flex flex-col w-full">
    <label [for]="id" class="text-sm font-medium text-gray-700 mb-1">
        {{ label }}
    </label>

    <input [id]="id" [type]="type" [formControl]="control" [placeholder]="placeholder" [class]="class" [class]="control.invalid && formDir?.submitted 
        ? 'border-red-500 focus:ring-2 focus:ring-red-500 focus:border-red-500 bg-red-50' 
        : 'border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500'"
        class="px-4 py-2 border border-gray-200 rounded-md">

    @if (control.invalid && formDir?.submitted) {
    <div class="text-red-500 text-xs mt-1 font-medium flex flex-col">
        @if (control.errors?.['required']) {
        <span>Este campo é obrigatório.</span>
        }
        @if (control.errors?.['minlength']) {
        <span>
            Digite ao menos {{ control.errors?.['minlength'].requiredLength }} caracteres.
        </span>
        }
    </div>
    }
</div>
