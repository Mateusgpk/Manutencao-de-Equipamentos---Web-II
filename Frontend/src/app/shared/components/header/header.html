<header
  class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-border shadow-sm shadow-primary-subtle/50">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">

    <a class="flex items-center gap-3 transition-transform hover:scale-[1.02]" routerLink="/">
      <span
        class="text-xl font-extrabold font-heading bg-linear-to-b from-primary to-primary-hover bg-clip-text text-transparent drop-shadow-sm">
        Manutenção
      </span>
    </a>

    <nav class="flex items-center gap-6 text-sm font-bold font-heading text-foreground-muted"
      aria-label="Navegação principal">
      @if (logado) { 
        @if (usuario?.user?.role === 'CLIENTE') { 
        <a class="bg-linear-to-b from-primary-subtle to-primary text-on-primary border border-primary px-5 py-1.5 rounded-full shadow-md shadow-primary/30 transition-all hover:brightness-110 hover:scale-105"
        routerLink="/home">Home</a>
        } @else { 
        <a class="bg-linear-to-b from-primary-subtle to-primary text-on-primary border border-primary px-5 py-1.5 rounded-full shadow-md shadow-primary/30 transition-all hover:brightness-110 hover:scale-105"
        routerLink="/employee/home">
        Acessar Painel
      </a>
        }
       }



      


      <div class="relative">
        @if (logado) {
          <button
            type="button"
            class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-muted border border-border text-foreground hover:border-primary hover:text-primary transition cursor-pointer"
            (click)="toggleMenu()"
            title="Perfil do usuário"
          >
            <i class="fa fa-user"></i>
          </button>
        
          @if (menuAberto) {
            <ul class="absolute right-0 mt-2 w-48 rounded-xl bg-surface border border-border shadow-lg p-2 z-50 text-sm list-none">
              <li class="px-3 py-1.5 font-bold font-heading text-foreground truncate">{{ usuario?.name }}</li>
              <li class="px-3 py-0.5 text-xs font-semibold text-primary mb-2">
                {{ usuario?.user?.role === 'CLIENTE' ? 'Cliente' : 'Funcionário' }}
              </li>
              <li class="border-t border-border/60 pt-1">
                <button
                  type="button"
                  class="w-full text-left px-3 py-1.5 rounded-lg text-danger hover:bg-danger/10 font-medium transition cursor-pointer flex items-center gap-2"
                  (click)="acao()"
                >
                  <i class="fa fa-sign-out"></i> Sair
                </button>
              </li>
            </ul>
          }
        }
      </div>
    </nav>


  </div>
</header>
